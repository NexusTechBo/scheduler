server {
    listen ${PORT};
    root /usr/share/nginx/html;

    # Security headers. nginx only inherits add_header directives into a location that declares
    # none of its own: any location that adds a header must repeat all of these.
    # - style-src 'unsafe-inline': Angular component styles, the inlined Google Fonts CSS and
    #   Chart.js canvas styles.
    # - img-src blob:: WhatsApp QR image (object URL).
    # - connect-src 'self': REST API (/api) and the STOMP WebSocket (/ws); CSP3 browsers match
    #   same-host ws:/wss: with 'self'.
    # - No inline or external scripts (critical CSS inlining is disabled in angular.json because
    #   it relies on an inline script).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Avoid duplicated values when the backend sends its own copies of these headers.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location = /ws {
        proxy_pass ${BACKEND_URL};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
