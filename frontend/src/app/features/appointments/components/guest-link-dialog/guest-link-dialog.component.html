<app-dialog-frame
  [title]="'appointments.guestLinkDialog.title' | translate"
  [subtitle]="'appointments.guestLinkDialog.subtitle' | translate"
  (closed)="ref.close()"
>
  <app-form-field
    [label]="'appointments.guestLinkDialog.inputLabel' | translate"
    fieldId="guest-link-url"
    [hint]="'appointments.guestLinkDialog.inputHint' | translate"
  >
    <input
      #urlInput
      id="guest-link-url"
      class="field-input"
      readonly
      [value]="link.url"
      (focus)="urlInput.select()"
    />
  </app-form-field>

  @if (copyFailed()) {
    <app-alert class="mt-4">
      {{ 'appointments.guestLinkDialog.failedAlert' | translate }}
    </app-alert>
  }

  <ng-container ngProjectAs="[dialogFooter]">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">
      {{ 'appointments.guestLinkDialog.close' | translate }}
    </button>
    <button
      type="button"
      class="btn btn-primary"
      [cdkCopyToClipboard]="link.url"
      (cdkCopyToClipboardCopied)="onCopied($event)"
    >
      {{ 'appointments.guestLinkDialog.copy' | translate }}
    </button>
  </ng-container>
</app-dialog-frame>
