<app-dialog-frame
  [title]="patient ? 'Editar paciente' : 'Nuevo paciente'"
  [subtitle]="patient ? patient.name : 'Datos de contacto del paciente'"
  (closed)="ref.close()"
>
  <form id="patient-form" [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    <app-form-field label="Nombre completo" fieldId="patient-name">
      <input id="patient-name" class="field-input" formControlName="name" autocomplete="off" />
    </app-form-field>

    <div class="grid gap-4 sm:grid-cols-2">
      <app-form-field label="Teléfono" fieldId="patient-phone" [errorMessages]="phoneErrors">
        <input
          id="patient-phone"
          type="tel"
          class="field-input"
          formControlName="phoneNumber"
          autocomplete="off"
        />
      </app-form-field>
      <app-form-field label="Email (opcional)" fieldId="patient-email">
        <input
          id="patient-email"
          type="email"
          class="field-input"
          formControlName="email"
          autocomplete="off"
        />
      </app-form-field>
    </div>

    <app-form-field label="CI" fieldId="patient-ci" [errorMessages]="ciErrors">
      <input
        id="patient-ci"
        class="field-input"
        formControlName="ci"
        inputmode="numeric"
        autocomplete="off"
      />
    </app-form-field>

    @if (error(); as message) {
      <app-alert>{{ message }}</app-alert>
    }
  </form>

  <ng-container ngProjectAs="[dialogFooter]">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">Cancelar</button>
    <button type="submit" form="patient-form" class="btn btn-primary" [disabled]="saving()">
      {{ saving() ? 'Guardando…' : patient ? 'Guardar cambios' : 'Crear paciente' }}
    </button>
  </ng-container>
</app-dialog-frame>
