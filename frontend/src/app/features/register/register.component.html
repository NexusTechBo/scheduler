<app-glass-background class="grid min-h-screen w-full grid-cols-10">
  <app-banner class="relative z-10 col-span-6 hidden lg:block" />
  @if (register.registeredEmail(); as email) {
    <app-register-success class="relative z-10 col-span-10 lg:col-span-4" [email]="email" />
  } @else {
    <app-register-form class="relative z-10 col-span-10 lg:col-span-4" />
  }
</app-glass-background>
