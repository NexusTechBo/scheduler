<form
  [formGroup]="form"
  (ngSubmit)="submit()"
  class="glass-panel w-full max-w-md rounded-3xl p-6 sm:p-8"
  novalidate
>
  <div class="mb-6">
    <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">Registra tu clínica</h1>
    <p class="mt-1 text-sm font-medium text-gray-500">
      Crea el espacio de tu clínica y la cuenta de su administrador
    </p>
  </div>

  <p class="mb-3 text-xs font-bold uppercase tracking-wide text-gray-500">Clínica</p>
  <div class="space-y-4">
    <div class="grid gap-4 sm:grid-cols-2">
      <app-form-field label="Nombre" fieldId="register-name">
        <input
          id="register-name"
          type="text"
          class="field-input"
          formControlName="name"
          autocomplete="organization"
          placeholder="Clínica Central"
        />
      </app-form-field>
      <app-form-field label="Teléfono" fieldId="register-phone" [errorMessages]="phoneErrors">
        <input
          id="register-phone"
          type="tel"
          class="field-input"
          formControlName="phoneNumber"
          autocomplete="tel"
          placeholder="+591 700 00000"
        />
      </app-form-field>
    </div>
    <app-form-field
      label="Subdominio"
      fieldId="register-subdomain"
      [hint]="'Los usuarios de tu clínica terminarán en @' + (suffix() || 'subdominio') + '.com'"
      [errorMessages]="subdomainErrors"
    >
      <input
        id="register-subdomain"
        type="text"
        class="field-input"
        formControlName="subdomain"
        autocomplete="off"
        placeholder="clinicacentral"
      />
    </app-form-field>
  </div>

  <p class="mb-3 mt-6 text-xs font-bold uppercase tracking-wide text-gray-500">Administrador</p>
  <div class="space-y-4">
    <div class="grid gap-4 sm:grid-cols-2">
      <app-form-field label="Nombre completo" fieldId="register-admin-name">
        <input
          id="register-admin-name"
          type="text"
          class="field-input"
          formControlName="adminName"
          autocomplete="name"
          placeholder="Tu nombre"
        />
      </app-form-field>
      <app-form-field label="CI" fieldId="register-admin-ci" [errorMessages]="ciErrors">
        <input
          id="register-admin-ci"
          type="text"
          class="field-input"
          formControlName="adminCi"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Documento de identidad"
        />
      </app-form-field>
    </div>
    <app-form-field
      label="Usuario"
      fieldId="register-admin-username"
      [errorMessages]="usernameErrors"
    >
      <div class="flex items-center gap-1.5">
        <input
          id="register-admin-username"
          type="text"
          class="field-input min-w-40 flex-1"
          formControlName="adminUsername"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          placeholder="admin"
        />
        <span class="min-w-0 truncate text-sm font-semibold text-gray-500"
          >&#64;{{ suffix() || 'subdominio' }}.com</span
        >
      </div>
    </app-form-field>
    <app-form-field label="Correo electrónico" fieldId="register-admin-email">
      <input
        id="register-admin-email"
        type="email"
        class="field-input"
        formControlName="adminEmail"
        autocomplete="email"
        placeholder="admin@tuclinica.com"
      />
    </app-form-field>
    <app-form-field label="Contraseña" fieldId="register-admin-password">
      <input
        id="register-admin-password"
        type="password"
        class="field-input"
        formControlName="adminPassword"
        autocomplete="new-password"
        placeholder="Mínimo 8 caracteres"
      />
    </app-form-field>
  </div>

  <button type="submit" class="btn btn-primary mt-6 w-full" [disabled]="register.submitting()">
    {{ register.submitting() ? 'Registrando…' : 'Registrar clínica' }}
  </button>

  <div class="mt-6 flex items-center gap-3">
    <span class="h-px flex-1 bg-gray-900/10"></span>
    <span class="text-xs font-medium text-gray-500">¿Ya tienes cuenta?</span>
    <span class="h-px flex-1 bg-gray-900/10"></span>
  </div>

  <a routerLink="/login" class="btn btn-secondary mt-4 w-full">Iniciar sesión</a>
</form>
