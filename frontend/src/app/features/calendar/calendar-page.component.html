<app-page-header [title]="calendar.monthLabel()">
  <div class="flex flex-wrap items-center gap-3">
    @if (calendar.canFilterMine()) {
      <app-segmented-tabs
        [items]="scopeTabs"
        [selectedId]="calendar.scope()"
        (select)="setScope($event)"
      />
    }
    <app-calendar-nav
      (previous)="calendar.shiftMonth(-1)"
      (next)="calendar.shiftMonth(1)"
      (today)="calendar.goToday()"
    />
  </div>
</app-page-header>

<div class="flex min-h-0 flex-1 flex-col gap-5 overflow-y-auto xl:flex-row xl:overflow-visible">
  <div
    class="glass-panel flex shrink-0 flex-col rounded-3xl p-3 sm:p-6 xl:min-h-0 xl:flex-[2.1]"
    [class.opacity-70]="calendar.isLoading()"
  >
    <div
      class="mb-2 grid shrink-0 grid-cols-7 gap-2 text-center text-[12.5px] font-bold uppercase tracking-wide text-gray-500"
    >
      @for (weekday of weekdays; track weekday.value) {
        <span>{{ weekday.short }}</span>
      }
    </div>

    <div
      class="-m-2 grid min-h-0 flex-1 grid-cols-7 grid-rows-6 gap-1 p-2 sm:gap-2.5 xl:overflow-y-auto"
    >
      @for (week of calendar.cells(); track $index) {
        @for (cell of week; track cell.day.iso) {
          <app-calendar-day-cell
            [day]="cell.day"
            [appointments]="cell.appointments"
            [selected]="cell.day.iso === calendar.selectedDate()"
            (select)="calendar.select($event)"
          />
        }
      }
    </div>

    @if (calendar.errorMessage(); as message) {
      <app-load-error class="mt-3" [message]="message" (retry)="calendar.reload()" />
    }
  </div>

  <app-day-agenda-panel
    [dayLabel]="calendar.selectedDayLabel()"
    [appointments]="calendar.selectedDayAppointments()"
    [errorMessage]="calendar.errorMessage()"
    [canCreate]="calendar.canCreateOnSelected()"
    (newAppointment)="calendar.openNewAppointment()"
    (open)="calendar.open($event)"
    (retry)="calendar.reload()"
  />
</div>
