<section [id]="anchor" class="scroll-mt-20 bg-white/60 py-24">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <div appReveal class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-bold uppercase tracking-wider text-primary">Cómo funciona</p>
      <h2 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">Empieza en tres pasos</h2>
    </div>
    <ol class="mt-14 grid gap-5 md:grid-cols-3">
      @for (step of steps; track step.title; let i = $index) {
        <li appReveal class="relative rounded-3xl border border-white/80 bg-white p-7 shadow-sm">
          <span
            class="mb-5 flex h-11 w-11 items-center justify-center rounded-2xl bg-linear-to-br from-primary to-secondary text-lg font-extrabold text-white shadow-lg shadow-primary/25"
            >{{ i + 1 }}</span
          >
          <h3 class="text-lg font-bold">{{ step.title }}</h3>
          <p class="mt-1.5 text-sm leading-relaxed text-gray-600">{{ step.description }}</p>
        </li>
      }
    </ol>
  </div>
</section>
