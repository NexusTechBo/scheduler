<section id="roles" class="scroll-mt-20 py-24">
    <div class="mx-auto max-w-6xl px-4 sm:px-6">
      <div appReveal class="mx-auto max-w-2xl text-center">
        <p class="text-sm font-bold uppercase tracking-wider text-primary">Para todo el equipo</p>
        <h2 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">
          Una vista para cada rol
        </h2>
      </div>

      <div
        appReveal
        class="mx-auto mt-10 flex w-fit flex-wrap justify-center gap-1 rounded-2xl border border-white/80 bg-white/70 p-1.5 shadow-sm backdrop-blur"
        role="tablist"
        aria-label="Roles"
      >
        @for (role of roles; track role.id) {
          <button
            type="button"
            role="tab"
            [id]="'role-tab-' + role.id"
            [attr.aria-selected]="role.id === activeRoleId()"
            aria-controls="role-panel"
            class="flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-semibold transition"
            [class]="
              role.id === activeRoleId()
                ? 'bg-primary text-white shadow-md shadow-primary/25'
                : 'text-gray-600 hover:bg-white'
            "
            (click)="activeRoleId.set(role.id)"
          >
            <app-ui-icon [name]="role.icon" class="h-4 w-4" />
            {{ role.label }}
          </button>
        }
      </div>

      @let role = activeRole();
      <div
        id="role-panel"
        role="tabpanel"
        [attr.aria-labelledby]="'role-tab-' + role.id"
        class="mt-10"
      >
        <div class="mx-auto max-w-2xl text-center">
          <h3 class="text-xl font-bold">{{ role.title }}</h3>
          <p class="mt-2 text-gray-600">{{ role.description }}</p>
        </div>
        <app-browser-frame class="mx-auto mt-8 max-w-5xl" [shot]="role.shot" />
      </div>
    </div>
  </section>
