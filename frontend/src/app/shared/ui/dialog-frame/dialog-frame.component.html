<div
  class="glass-modal relative flex max-h-[90vh] w-[28rem] max-w-[calc(100vw-2rem)] flex-col rounded-3xl p-6"
>
  <div class="mb-5 flex shrink-0 items-start justify-between gap-3 pr-10">
    <div>
      <h2 [id]="titleId" tabindex="-1" class="text-xl font-extrabold text-gray-900 outline-none">
        {{ title() }}
      </h2>
      @if (subtitle()) {
        <p class="text-sm font-medium text-gray-500">{{ subtitle() }}</p>
      }
    </div>
  </div>

  <div class="-m-1 min-h-0 flex-1 scroll-py-3 overflow-y-auto p-1">
    <ng-content />
  </div>

  <div class="mt-6 flex shrink-0 flex-wrap justify-end gap-2.5 empty:hidden">
    <ng-content select="[dialogFooter]" />
  </div>

  <button
    type="button"
    class="btn-icon absolute right-5 top-5"
    (click)="closed.emit()"
    aria-label="Cerrar"
  >
    <app-ui-icon name="x" class="h-4.5 w-4.5" />
  </button>
</div>
