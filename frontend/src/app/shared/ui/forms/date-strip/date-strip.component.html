<div class="-mx-3 flex scroll-px-3 gap-2 overflow-x-auto px-3 pt-1 pb-4">
  @for (day of days(); track day.iso) {
    <button
      type="button"
      class="flex w-16 shrink-0 cursor-pointer flex-col items-center rounded-2xl py-2.5 transition-all focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-900"
      [class]="
        selected() === day.iso
          ? 'bg-primary text-white shadow-lg shadow-primary/30'
          : 'bg-white/50 text-gray-600 hover:bg-white/80'
      "
      [attr.aria-pressed]="selected() === day.iso"
      (click)="select.emit(day.iso)"
    >
      <span class="text-[11px] font-bold uppercase">{{ day.weekday }}</span>
      <span class="text-lg font-extrabold leading-tight">{{ day.day }}</span>
      <span class="text-[11px] font-semibold opacity-80">{{ day.month }}</span>
    </button>
  }
</div>
