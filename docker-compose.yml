services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_URL: ${DOCKER_DB_URL:-jdbc:postgresql://host.docker.internal:5432/scheduler}
      PORT: 8080
      APP_FRONTEND_URL: http://localhost:4200
    ports:
      - "8080:8080"
    mem_limit: 768m
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      PORT: 80
      BACKEND_URL: http://backend:8080
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
