spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  config:
    import: optional:file:.env[.properties]
  application:
    name: scheduler
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
  flyway:
    locations: classpath:db/migration/public
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: true
            required: true
  mvc:
    log-resolved-exception: false
  task:
    execution:
      mode: force
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite

server:
  port: ${PORT}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

security:
  public-paths: /api/auth/login, /api/clinics, /api/clinics/activate, /api/clinics/activation/resend, /swagger-ui/**, /v3/api-docs/**, /api/public/guest/session

app:
  zone: ${APP_ZONE:America/La_Paz}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Scheduler}
