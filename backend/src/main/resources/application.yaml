spring:
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  config:
    import: optional:file:.env[.properties]
  application:
    name: scheduler
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
  flyway:
    locations: classpath:db/migration/public
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: true
            required: true
  mvc:
    log-resolved-exception: false
  task:
    execution:
      mode: force
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite

server:
  port: ${PORT}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

security:
  public-paths: /api/auth/login, /api/clinics, /api/clinics/activate, /api/clinics/activation/resend, /api/public/guest/session, /ws/**, /actuator/health, /swagger-ui/**, /v3/api-docs/**
  system-paths: /ws, /actuator/health, /swagger-ui, /v3/api-docs, /favicon.ico

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  cache-max-size: ${RATE_LIMIT_CACHE_MAX_SIZE:100000}
  excluded-paths: [/actuator/**, /swagger-ui/**, /v3/api-docs/**, /ws/**, /favicon.ico]
  policies:
    - name: login
      methods: [POST]
      paths: [/api/auth/login]
      key: IP
      limits:
        - capacity: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
          period: 1m
        - capacity: ${RATE_LIMIT_LOGIN_PER_HOUR:20}
          period: 1h
    - name: activation-resend
      methods: [POST]
      paths: [/api/clinics/activation/resend]
      key: IP
      limits:
        - capacity: ${RATE_LIMIT_ACTIVATION_RESEND_PER_15_MINUTES:3}
          period: 15m
        - capacity: ${RATE_LIMIT_ACTIVATION_RESEND_PER_DAY:10}
          period: 24h
    - name: clinic-registration
      methods: [POST]
      paths: [/api/clinics, /api/clinics/activate]
      key: IP
      limits:
        - capacity: ${RATE_LIMIT_CLINIC_REGISTRATION_PER_15_MINUTES:5}
          period: 15m
        - capacity: ${RATE_LIMIT_CLINIC_REGISTRATION_PER_DAY:20}
          period: 24h
    - name: guest-session
      methods: [POST]
      paths: [/api/public/guest/session]
      key: IP
      limits:
        - capacity: ${RATE_LIMIT_GUEST_SESSION_PER_MINUTE:10}
          period: 1m
    - name: guest-booking
      methods: [POST]
      paths: [/api/guest/appointments, /api/guest/appointments/new-patient]
      key: IP
      limits:
        - capacity: ${RATE_LIMIT_GUEST_BOOKING_PER_15_MINUTES:5}
          period: 15m
        - capacity: ${RATE_LIMIT_GUEST_BOOKING_PER_DAY:15}
          period: 24h
    - name: guest-read
      methods: [GET, HEAD]
      paths: [/api/guest/**]
      key: IP
      limits:
        - capacity: ${RATE_LIMIT_GUEST_READ_PER_MINUTE:60}
          period: 1m
    - name: staff
      paths: [/api/**]
      key: USER
      limits:
        - capacity: ${RATE_LIMIT_STAFF_PER_MINUTE:300}
          period: 1m

app:
  zone: ${APP_ZONE:America/La_Paz}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM}
    from-name: ${MAIL_FROM_NAME:Scheduler}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    com.example.scheduler: ${LOG_LEVEL:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
